<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Rider - Soul Collector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #000;
            font-family: Arial;
        }
        #gameContainer {
            text-align: center;
        }
        h1 {
            color: #ff6600;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff6600;
        }
        canvas {
            border: 3px solid #ff6600;
            background: #0a0a0a;
            display: block;
            cursor: crosshair;
        }
        #ui {
            color: #00ff00;
            margin-top: 20px;
            font-size: 18px;
        }
        #instructions {
            color: #ffaa00;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>🔥 Ghost Rider - Soul Collector 🔥</h1>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <p>Souls: <span id="souls">0</span> | Score: <span id="score">0</span> | Health: <span id="health">100</span></p>
        </div>
        <div id="instructions">
            <p>⬆️⬇️⬅️➡️ or WASD to move | Collect green souls | Avoid red enemies | Press R to restart</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gameRunning = true;
        let soulCount = 0;
        let score = 0;
        let health = 100;

        // Player
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            width: 30,
            height: 30,
            speed: 4
        };

        // Souls
        let souls = [];
        for (let i = 0; i < 10; i++) {
            souls.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: 6
            });
        }

        // Enemies
        let enemies = [];
        for (let i = 0; i < 3; i++) {
            enemies.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                width: 25,
                height: 25,
                speed: 2
            });
        }

        // Keyboard input
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'r' && !gameRunning) {
                location.reload();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Update
        function update() {
            if (!gameRunning) return;

            // Player movement
            if (keys['arrowup'] || keys['w']) player.y -= player.speed;
            if (keys['arrowdown'] || keys['s']) player.y += player.speed;
            if (keys['arrowleft'] || keys['a']) player.x -= player.speed;
            if (keys['arrowright'] || keys['d']) player.x += player.speed;

            // Boundary check
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            // Update enemies
            for (let enemy of enemies) {
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance > 0) {
                    enemy.x += (dx / distance) * enemy.speed;
                    enemy.y += (dy / distance) * enemy.speed;
                }
            }

            // Check soul collection
            for (let i = souls.length - 1; i >= 0; i--) {
                const soul = souls[i];
                const dx = player.x - soul.x;
                const dy = player.y - soul.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < player.width / 2 + soul.radius) {
                    soulCount++;
                    score += 10;
                    souls.splice(i, 1);
                    souls.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: 6
                    });
                }
            }

            // Check enemy collision
            for (let enemy of enemies) {
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < player.width / 2 + enemy.width / 2) {
                    health -= 0.5;
                    if (health <= 0) {
                        gameRunning = false;
                    }
                }
            }
        }

        // Draw
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw souls (green)
            ctx.fillStyle = '#00ff00';
            ctx.shadowColor = 'rgba(0, 255, 0, 0.8)';
            ctx.shadowBlur = 10;
            for (let soul of souls) {
                ctx.beginPath();
                ctx.arc(soul.x, soul.y, soul.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // Draw enemies (red)
            ctx.fillStyle = '#ff0000';
            ctx.shadowColor = 'rgba(255, 0, 0, 0.8)';
            ctx.shadowBlur = 10;
            for (let enemy of enemies) {
                ctx.fillRect(enemy.x - enemy.width / 2, enemy.y - enemy.height / 2, enemy.width, enemy.height);
            }
            ctx.shadowBlur = 0;

            // Draw player (orange)
            ctx.fillStyle = '#ff6600';
            ctx.shadowColor = 'rgba(255, 102, 0, 0.8)';
            ctx.shadowBlur = 15;
            ctx.fillRect(player.x - player.width / 2, player.y - player.height / 2, player.width, player.height);
            ctx.shadowBlur = 0;

            // Draw game over
            if (!gameRunning) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff6600';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.fillStyle = '#00ff00';
                ctx.font = '20px Arial';
                ctx.fillText('Press R to Restart', canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        // Update UI
        function updateUI() {
            document.getElementById('souls').textContent = soulCount;
            document.getElementById('score').textContent = score;
            document.getElementById('health').textContent = Math.max(0, Math.floor(health));
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
